
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-2xl mx-auto">
        <header class="mb-8">
            <h2 class="text-2xl font-bold text-gray-900">Alterar Tamanho da Camisa</h2>
            <p class="text-sm text-gray-400">Atualize as informações de fardamento do guarda</p>
        </header>

        <div class="grid grid-cols-3 gap-3 mb-8">
            <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-center">
                <p class="text-[10px] uppercase font-bold text-gray-400 mb-1">Guarda</p>
                <p class="text-sm font-semibold">Wendel Henrique</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-center">
                <p class="text-[10px] uppercase font-bold text-gray-400 mb-1">Tamanho Atual</p>
                <p class="text-sm font-semibold">G</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm text-center">
                <p class="text-[10px] uppercase font-bold text-gray-400 mb-1">Situação</p>
                <span class="text-[10px] px-2 py-0.5 rounded-full font-medium bg-green-50 text-green-700">APTO</span>
            </div>
        </div>

        <form class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Novo Tamanho</label>
                <select class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <option>P</option>
                    <option>M</option>
                    <option selected>G</option>
                    <option>GG</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Situação</label>
                    <select class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option>APTO</option>
                        <option>INAPTO</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Equipe</label>
                    <select class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        <option>Alpha</option>
                        <option>Bravo</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Justificativa</label>
                <textarea rows="3" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Motivo da troca..."></textarea>
            </div>

            <button type="button" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200">
                Salvar Alterações
            </button>
        </form>
    </div>
</body>
</html>
