<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNSN - Gestão de Fardamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ícones Lucide (Simulado via CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900">


    <nav class="bg-white border-b border-gray-100 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">G</div>
                <h1 class="text-lg font-semibold tracking-tight">GNSN <span class="text-gray-400 font-normal">/ Fardamento</span></h1>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs px-3 py-1 rounded-full bg-blue-50 text-blue-700 font-medium border border-blue-100">Administrador</span>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        
   
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h2 class="text-2xl font-bold">Lista de Camisas</h2>
                <p class="text-sm text-gray-400">Gerenciamento e controle de entregas</p>
            </div>
            
            <div class="flex gap-2">
                <input type="text" placeholder="Buscar por nome ou matrícula..." class="px-4 py-2 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-64 shadow-sm">
                <button class="bg-blue-600 text-white px-5 py-2 rounded-xl text-sm font-medium hover:bg-blue-700 transition-colors shadow-sm">Buscar</button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50/50 border-b border-gray-100">
                            <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Guarda</th>
                            <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Ano / Equipe</th>
                            <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Tamanho</th>
                            <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-wider text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-50">
                        
                   
                        <tr class="hover:bg-gray-50/50 transition-colors">
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-gray-200 overflow-hidden border border-gray-100">
                                        <img src="https://via.placeholder.com/150" alt="Perfil">
                                    </div>
                                    <div>
                                        <p class="text-sm font-semibold text-gray-900 leading-none">Wendel Henrique</p>
                                        <p class="text-xs text-gray-400 mt-1">Mat. 00342</p>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <p class="text-sm text-gray-600">2026</p>
                                <p class="text-[10px] uppercase font-bold text-blue-500">Equipe Alpha</p>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-2 py-1 bg-gray-100 rounded text-xs font-bold text-gray-600">G</span>
                            </td>
                            <td class="px-6 py-4">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-50 text-green-700 border border-green-100">
                                    Entregue
                                </span>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <button class="text-blue-600 hover:text-blue-800 text-xs font-semibold">Ver Termo</button>
                            </td>
                        </tr>

                 
                        <tr class="hover:bg-gray-50/50 transition-colors">
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-red-50 text-red-700 flex items-center justify-center text-xs font-bold border border-red-100">
                                        JS
                                    </div>
                                    <div>
                                        <p class="text-sm font-semibold text-gray-900 leading-none">João Silva</p>
                                        <p class="text-xs text-gray-400 mt-1">Mat. 00501</p>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <p class="text-sm text-gray-600">2026</p>
                                <p class="text-[10px] uppercase font-bold text-amber-500">Equipe Bravo</p>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-2 py-1 bg-gray-100 rounded text-xs font-bold text-gray-600">M</span>
                            </td>
                            <td class="px-6 py-4">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-50 text-red-700 border border-red-100">
                                    Pendente
                                </span>
                            </td>
                            <td class="px-6 py-4 text-right text-gray-300 text-xs">
                                —
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>

       
        <div class="flex items-center justify-between mt-6 px-2 text-sm text-gray-400">
            <p>Mostrando 2 de 145 resultados</p>
            <div class="flex gap-2">
                <button class="px-4 py-2 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">Anterior</button>
                <button class="px-4 py-2 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">Próximo</button>
            </div>
        </div>
    </main>

    <script>
        // Inicializa ícones lucide se necessário
        lucide.createIcons();
    </script>
</body>
</html>
