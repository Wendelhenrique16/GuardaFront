<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Entregas - GNSN</title>
    <!-- Tailwind para o design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js para os gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Navbar -->
    <nav class="bg-blue-800 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">GNSN - Sistema de Gestão</h1>
            <span class="text-sm opacity-80">Relatório de Fardamento v2.0</span>
        </div>
    </nav>

    <main class="container mx-auto py-8 px-4">
        
        <!-- Painel Superior (Cards) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-md border-l-8 border-green-500">
                <h5 class="text-gray-500 uppercase text-xs font-bold">Guardas que receberam</h5>
                <p class="text-3xl font-black text-gray-800" id="totalGuardas">145</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md border-l-8 border-blue-500">
                <h5 class="text-gray-500 uppercase text-xs font-bold">Total de Camisas entregues</h5>
                <p class="text-3xl font-black text-gray-800" id="totalCamisas">290</p>
            </div>
        </div>
<!-- Card de Mirim Pendente (Estilo Wallace) -->
<div class="flex items-center gap-3 py-3 border-b border-gray-50">
  <!-- Avatar com Iniciais -->
  <div class="w-9 h-9 rounded-full bg-red-50 text-red-800 flex items-center justify-center text-xs font-semibold">
    WH
  </div>
  <!-- Informações -->
  <div class="flex-1">
    <p class="text-sm font-medium text-gray-900">Wendel Henrique</p>
    <p class="text-xs text-gray-400">Tamanho: G · Equipe: Alpha · Aguardando há 12 dias</p>
  </div>
  <!-- Badge de Status -->
  <span class="text-[10px] px-2 py-0.5 rounded-full font-medium bg-amber-50 text-amber-800 border border-amber-100">
    Pendente
  </span>
</div>
        <!-- Título da Seção -->
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-700">Status por Equipe</h2>
            <p class="text-gray-500 text-sm">Dados atualizados em tempo real (Simulado)</p>
        </div>

        <!-- Grid de Gráficos -->
        <div id="graficosContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Os gráficos serão inseridos aqui pelo JS -->
        </div>
    </main>

    <script>
        // SIMULAÇÃO DE DADOS (O que viria do Django)
        const geralData = {
            total_guardas: 200,
            recebidos_guardas: 145,
            nao_recebidos_guardas: 55
        };

        const equipesData = [
            { equipe: "Alpha", recebidos_guardas: 40, nao_recebidos_guardas: 10, total_guardas: 50, cor: '#4F46E5' },
            { equipe: "Bravo", recebidos_guardas: 35, nao_recebidos_guardas: 15, total_guardas: 50, cor: '#10B981' },
            { equipe: "Charlie", recebidos_guardas: 45, nao_recebidos_guardas: 5, total_guardas: 50, cor: '#F59E0B' },
            { equipe: "Delta", recebidos_guardas: 25, nao_recebidos_guardas: 25, total_guardas: 50, cor: '#EF4444' }
        ];

        function configPie(labels, data, colors, titulo) {
            return {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } },
                        title: { display: true, text: titulo, font: { size: 12, weight: 'normal' }, color: '#666' },
                        datalabels: {
                            color: '#fff',
                            font: { weight: 'bold', size: 11 },
                            formatter: (value, ctx) => {
                                let sum = ctx.dataset.data.reduce((a, b) => a + b, 0);
                                return ((value * 100) / sum).toFixed(0) + "%";
                            }
                        }
                    }
                },
                plugins: [ChartDataLabels]
            };
        }

        const container = document.getElementById("graficosContainer");

        // Gerar Gráficos por Equipe
        equipesData.forEach(e => {
            const card = document.createElement("div");
            card.className = "bg-white p-4 rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-200";
            card.innerHTML = `
                <h6 class="text-center font-bold text-gray-700 mb-4 border-b pb-2">${e.equipe}</h6>
                <div class="h-48">
                    <canvas id="chart_${e.equipe}"></canvas>
                </div>
            `;
            container.appendChild(card);

            new Chart(document.getElementById(`chart_${e.equipe}`).getContext('2d'), 
                configPie(['Recebeu', 'Pendente'], [e.recebidos_guardas, e.nao_rece_guardas || e.nao_recebidos_guardas], [e.cor, '#E5E7EB'], 
                `${e.recebidos_guardas}/${e.total_guardas} Concluído`)
            );
        });

        // Simular o auto-reload que o Roberto colocou
        console.log("Monitorando: O Dashboard seria atualizado em 30 segundos.");
    </script>
</body>
</html>
