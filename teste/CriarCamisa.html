
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="bg-blue-600 p-8 text-white">
            <h3 class="text-xl font-bold">Novo Cadastro de Camisa</h3>
            <p class="text-blue-100 text-xs mt-1">Vincule um fardamento ao Guarda Mirim</p>
        </div>

        <div class="p-8">

            <div class="flex items-center gap-4 p-4 bg-gray-50 rounded-2xl mb-8">
                <div class="w-12 h-12 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold">WH</div>
                <div>
                    <p class="text-sm font-bold text-gray-900">Wendel Henrique</p>
                    <p class="text-xs text-gray-400">Matrícula: 2023001</p>
                </div>
            </div>

            <form class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Ano de Referência</label>
                        <input type="number" value="2026" class="w-full p-3 border border-gray-100 bg-gray-50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Tamanho</label>
                        <select class="w-full p-3 border border-gray-100 bg-gray-50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                            <option>P</option>
                            <option>M</option>
                            <option>G</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Equipe Designada</label>
                    <select class="w-full p-3 border border-gray-100 bg-gray-50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        <option>Alpha</option>
                        <option>Bravo</option>
                    </select>
                </div>

                <div class="pt-4">
                    <button type="button" class="w-full bg-gray-900 text-white py-3 rounded-2xl font-bold hover:bg-black transition-all">
                        Finalizar Cadastro
                    </button>
                    <button type="button" class="w-full mt-2 text-gray-400 text-xs font-medium hover:text-gray-600">
                        Cancelar e voltar
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
