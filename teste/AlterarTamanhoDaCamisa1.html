<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Visualização - Alterar Tamanho da Camisa</title>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand">Sistema GNSN - Protótipo</span>
        </div>
    </nav>

    <div class="container bg-white p-4 shadow-sm rounded">
        <h3>Alterar Tamanho da Camisa</h3>

        <div class="alert alert-info mb-4">
            <strong>Guarda:</strong> Wendel Henrique <br>
            <strong>Tamanho atual:</strong> G<br>
            <strong>Situação atual:</strong> <span class="badge bg-success">APTO</span>
        </div>

        <form class="needs-validation" novalidate>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="tamcamisa" class="form-label">Novo Tamanho</label>
                    <select class="form-select" id="tamcamisa" required>
                        <option value="" disabled selected>Selecione um tamanho</option>
                        <option value="P">P</option>
                        <option value="M">M</option>
                        <option value="G">G</option>
                        <option value="GG">GG</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="situacao" class="form-label">Situação</label>
                    <select class="form-select" id="situacao" required>
                        <option value="1">APTO</option>
                        <option value="0">INAPTO</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="equipe" class="form-label">Equipe</label>
                <select class="form-select" id="equipe" required>
                    <option value="" disabled selected>Selecione a equipe</option>
                    <option value="Alpha">Alpha</option>
                    <option value="Bravo">Bravo</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="justificativa" class="form-label">Justificativa</label>
                <select class="form-select" id="justificativa">
                    <option value="" disabled selected>Selecione uma justificativa</option>
                    <option value="Troca por desgaste">Troca por desgaste</option>
                    <option value="Mudança de medidas">Mudança de medidas</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="observacao" class="form-label">Observação</label>
                <textarea class="form-control" id="observacao" rows="2" placeholder="Digite uma observação..."></textarea>
            </div>

            <button type="button" class="btn btn-primary w-100">Alterar Camisa</button>
        </form>

        <hr class="my-4">

        <h5>Log de Alterações</h5>
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-start">
                <div>
                    11/05/2026 17:00 - Admin:
                    Tamanho: M → G, Situação: APTO → APTO.
                    <br><strong>Justificativa:</strong> Mudança de medidas
                </div>
                <button type="button" class="btn btn-sm btn-outline-info">Ver Observação</button>
            </li>
        </ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
