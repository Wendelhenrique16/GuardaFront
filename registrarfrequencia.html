<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>GNSN - Registrar Frequência</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#F2F4F7]">

    <header class="bg-[#2D5A9E] text-white pt-10 pb-20 rounded-b-[2.5rem] shadow-xl relative overflow-hidden text-center">
        <div class="absolute inset-0 opacity-15 flex items-center justify-center pointer-events-none">
            <img src="https://via.placeholder.com/400?text=BRASÃO+GNSN" class="w-80 scale-150">
        </div>

        <div class="relative z-10 flex flex-col items-center">
            <div class="w-24 h-24 rounded-full border-4 border-[#FFA500] overflow-hidden mb-3 shadow-md">
                <img src="https://i.pravatar.cc/300" alt="Lucas Andre" class="w-full h-full object-cover">
            </div>
            
            <h2 class="text-xl font-extrabold tracking-tight">Nome Sobrenome da Silva</h2>
            <p class="text-xs opacity-80 mt-1 uppercase font-semibold">Mat. 0000 · Guarda Mirim</p>
            
            <div class="mt-3 bg-[#FFA500] text-white px-4 py-1 rounded-full text-[10px] font-bold flex items-center gap-1 shadow-sm uppercase">
                <span>⭐</span> Aspirante do Círio
            </div>
        </div>
    </header>

    <main class="container mx-auto px-5 -mt-10 relative z-20">
        <div class="max-w-md mx-auto space-y-4">
            
            <div class="bg-white rounded-[2rem] p-8 shadow-sm">
                <div class="flex items-center gap-2 mb-6">
                    <div class="w-1.5 h-6 bg-[#2D5A9E] rounded-full"></div>
                    <h3 class="text-[#2D5A9E] font-extrabold text-sm uppercase tracking-wide">Registrar Presença</h3>
                </div>
                
                <form class="space-y-6">
                    <div class="space-y-1">
                        <label class="text-[11px] font-bold text-gray-400 uppercase ml-1">Selecionar Mirim</label>
                        <div class="relative">
                            <select class="w-full p-4 bg-[#F8F9FA] border border-gray-100 rounded-2xl text-sm font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-blue-400 transition-all appearance-none">
                                <option>Escolha o nome...</option>
                                <option>Guarda Mirim Exemplo</option>
                            </select>
                            <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">▼</div>
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="text-[11px] font-bold text-gray-400 uppercase ml-1">Evento / Missão</label>
                        <div class="relative">
                            <select class="w-full p-4 bg-[#F8F9FA] border border-gray-100 rounded-2xl text-sm font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-blue-400 transition-all appearance-none">
                                <option>Selecione a missão...</option>
                                <option>Formatura Mensal</option>
                            </select>
                            <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">▼</div>
                        </div>
                    </div>

                    <button type="button" class="w-full bg-[#2D5A9E] text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-900/20 active:scale-[0.98] transition-all uppercase text-xs tracking-[0.1em]">
                        Confirmar Frequência
                    </button>
                </form>
            </div>


            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 bg-[#2D5A9E] rounded-2xl flex items-center justify-center text-white text-xl">
                    🏆
                </div>
                <div>
                    <p class="text-lg font-bold text-gray-800 leading-none">Jornada do Círio</p>
                    <p class="text-[10px] text-gray-400 mt-1 uppercase font-bold tracking-tighter">Faltam 8 presenças para</p>
                </div>
            </div>

        </div>
    </main>

    <footer class="mt-10 mb-8 text-center">
        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">GNSN · Gestão 2026</p>
    </footer>

</body>
</html>
